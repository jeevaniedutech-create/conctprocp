<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CPA Kerala</title>
    <script>
      // GitHub Pages SPA fallback — redirect to index.html while preserving the path.
      var segmentCount = 1; // matches `/athprojecttb/`
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
